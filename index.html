
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090611">
<title>لمّة | Lamma</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090611;color:white;font-family:Arial;text-align:center}
header{padding:30px 15px}
.logo{font-size:44px;font-weight:bold;color:#bd75ff;text-shadow:0 0 20px #922cff}
.sub{color:#b9a9c9}
main{padding:15px;max-width:500px;margin:auto}
button{width:100%;padding:17px;margin:9px 0;border:1px solid #a34bff;border-radius:15px;background:#190d29;color:white;font-size:18px}
.primary{background:linear-gradient(100deg,#7925d9,#bd55ff);border:0}
.card{background:#151020;border:1px solid #39204e;border-radius:18px;padding:18px;margin:14px 0}
.answer{background:#211331}
#question{font-size:20px;line-height:1.7}
</style>
</head>
<body>
<header>
<div class="logo">💜 لمّة</div>
<div class="sub">اللعبة أحلى مع اللمة</div>
</header>
<main>
<h2>أهلاً وسهلاً فيك!</h2>
<p class="sub">اختار فئة الأسئلة وابدأ التحدي</p>
<button class="primary" onclick="startQuiz('ثقافة عامة')">🎯 ثقافة عامة</button>
<button onclick="startQuiz('كرة القدم')">⚽ كرة القدم</button>
<div class="card">
<h3 id="category">جاهز للتحدي؟</h3>
<p id="question">اختار فئة الأسئلة لنبدأ 💜</p>
<div id="answers"></div>
<p id="result"></p>
<button onclick="nextQuestion()">السؤال التالي ←</button>
</div>
</main>
<script>
const SUPABASE_URL = "https://wnspaepdhlaxiglwyskt.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_cakNhgQ6kVBLMd0VRHAJbA_gzp6hA8n";

let questions=[];
let current=0;
let score=0;
let answered=false;

async function startQuiz(category){
current=0;
score=0;
questions=[];
document.getElementById('category').textContent=category;
document.getElementById('question').textContent='جاري تحميل الأسئلة...';
document.getElementById('answers').innerHTML='';
document.getElementById('result').textContent='';

try{
const url=SUPABASE_URL.replace(/\/$/,'')+
'/rest/v1/questions?quiz=eq.'+
encodeURIComponent(category)+
'&select=prompt,option_a,option_b,option_c,option_d,correct_index';

const response=await fetch(url,{
headers:{
'apikey':SUPABASE_KEY,
'Authorization':'Bearer '+SUPABASE_KEY
}
});

if(!response.ok)throw new Error('تعذر تحميل الأسئلة');
questions=await response.json();

if(!questions.length){
document.getElementById('question').textContent='لا توجد أسئلة بهذه الفئة.';
return;
}
showQuestion();
}catch(error){
document.getElementById('question').textContent='تعذر الاتصال بقاعدة البيانات. تأكد من الرابط والمفتاح.';
}
}

function showQuestion(){
answered=false;
if(current>=questions.length){
document.getElementById('question').textContent='انتهى التحدي! نتيجتك '+score+' من '+questions.length;
document.getElementById('answers').innerHTML='';
document.getElementById('result').textContent='أحسنت! 💜';
return;
}
const q=questions[current];
document.getElementById('question').textContent=(current+1)+' - '+q.prompt;
document.getElementById('result').textContent='';
const options=[q.option_a,q.option_b,q.option_c,q.option_d];
const area=document.getElementById('answers');
area.innerHTML='';
options.forEach((option,i)=>{
const b=document.createElement('button');
b.className='answer';
b.textContent=option;
b.onclick=()=>{
if(answered)return;
answered=true;
if(i===q.correct_index){
score++;
document.getElementById('result').textContent='إجابة صحيحة! 👏';
}else{
document.getElementById('result').textContent='إجابة خاطئة 💜';
}
};
area.appendChild(b);
});
}

function nextQuestion(){
if(!questions.length)return;
if(!answered){
document.getElementById('result').textContent='اختار إجابة أولاً!';
return;
}
current++;
showQuestion();
}
</script>
</body>
</html>
